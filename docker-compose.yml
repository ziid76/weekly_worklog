services:
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    environment:
      POSTGRES_DB: \        
      POSTGRES_USER: \
      POSTGRES_PASSWORD: \
    restart: always

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      POSTGRES_DB: \
      POSTGRES_USER: \    
      POSTGRES_PASSWORD: \
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: always
  nginx:
    image: nginx:alpine
    container_name: itms-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/itsm/static:/app/staticfiles
      - /data/itsm/media:/app/media
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    restart: always

volumes:
  postgres_data:

