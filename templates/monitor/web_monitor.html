{% extends 'basic.html' %}
{% block page_name %}웹사이트 모니터링 대시보드{% endblock %}

{% block content %}
<div class="flex flex-col gap-6">
    <!-- Status Overview -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="group bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm transition-all duration-300 flex items-center gap-6 overflow-hidden relative">
            <div class="size-16 rounded-2xl bg-blue-50 flex items-center justify-center text-blue-600">
                <span class="material-symbols-outlined text-3xl">language</span>
            </div>
            <div>
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">전체 모니터링 수</p>
                <h3 class="text-4xl font-black text-slate-900 mt-1" id="stat-total">-</h3>
            </div>
        </div>
        
        <div class="group bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm transition-all duration-300 flex items-center gap-6 overflow-hidden relative">
            <div class="size-16 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-600">
                <span class="material-symbols-outlined text-3xl">verified</span>
            </div>
            <div>
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">정상 서비스</p>
                <h3 class="text-4xl font-black text-emerald-600 mt-1" id="stat-up">-</h3>
            </div>
        </div>

        <div class="group bg-white p-8 rounded-[2rem] border-2 border-red-50 shadow-sm transition-all duration-300 flex items-center gap-6 overflow-hidden relative">
            <div class="size-16 rounded-2xl bg-red-50 flex items-center justify-center text-red-600">
                <span class="material-symbols-outlined text-3xl">warning_amber</span>
            </div>
            <div>
                <p class="text-xs font-black text-slate-400 uppercase tracking-widest">장애 발생</p>
                <h3 class="text-4xl font-black text-red-600 mt-1" id="stat-down">-</h3>
            </div>
            <div id="stat-down-pulse" class="absolute inset-0 bg-red-500/5 animate-pulse pointer-events-none hidden"></div>
        </div>
    </div>

    <!-- Targets Grid Section -->
    <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
            <h3 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <span class="material-symbols-outlined">analytics</span>
                모니터링 대상
                <span id="loading-spinner" class="material-symbols-outlined animate-spin text-slate-300 text-lg hidden">refresh</span>
            </h3>
            <div class="flex items-center gap-4">
                <!-- Auto Refresh Toggle -->
                <div class="flex items-center gap-3 bg-white px-4 py-2 rounded-xl border border-slate-100 shadow-sm">
                    <div class="flex items-center gap-2">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider">Auto Refresh</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="autoRefreshToggle" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div id="refreshTimer" class="text-xs font-mono font-black text-primary bg-primary/5 px-2 py-0.5 rounded-md border border-primary/10 min-w-[28px] text-center">30</div>
                </div>

                <a href="{{ embed_access_url }}/web-monitor/logs/" target="_blank" class="px-5 py-2.5 bg-slate-100 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-200 transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">history</span>
                    전체 로그
                </a>
                
                <a href="{{ embed_access_url }}/web-monitor/target/add/" target="_blank" class="px-5 py-2.5 bg-slate-800 text-white text-sm font-bold rounded-xl hover:bg-slate-900 transition-all flex items-center gap-2 shadow-lg shadow-slate-300">
                    <span class="material-symbols-outlined text-sm">open_in_new</span>
                    모니터웹 관리
                </a>
            </div>
        </div>

        <div id="targets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- Target cards will be dynamically rendered here via API -->
            <div class="col-span-full py-20 bg-white rounded-3xl border border-slate-100 flex flex-col items-center justify-center gap-4">
                <span class="material-symbols-outlined text-slate-300 text-4xl animate-spin">autorenew</span>
                <p class="text-sm font-bold text-slate-400">데이터를 불러오는 중입니다...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = "{% url 'web_monitor_api_proxy' %}";
    const TARGET_BASE_URL = "{{ embed_access_url }}/web-monitor/target";

    function fetchDashboardData() {
        const spinner = document.getElementById('loading-spinner');
        spinner.classList.remove('hidden');

        fetch(API_URL)
            .then(res => res.json().catch(() => ({})).then(data => ({ ok: res.ok, status: res.status, data })))
            .then(({ ok, status, data }) => {
                if (!ok) {
                    throw new Error(data.error || `시스템 연결 실패 (Status: ${status})`);
                }
                if (!data || typeof data !== 'object') {
                    throw new Error('올바르지 않은 데이터 형식입니다.');
                }

                // 통계 업데이트
                document.getElementById('stat-total').innerText = data.total_count ?? '-';
                document.getElementById('stat-up').innerText = data.up_count ?? '-';
                document.getElementById('stat-down').innerText = data.down_count ?? '-';
                
                const pulse = document.getElementById('stat-down-pulse');
                if (data.down_count > 0) {
                    pulse.classList.remove('hidden');
                } else {
                    pulse.classList.add('hidden');
                }

                // 타겟 카드 렌더링
                const container = document.getElementById('targets-container');
                
                if (data.targets && data.targets.length > 0) {
                    container.innerHTML = data.targets.map(t => {
                        let statusHtml = '';
                        let borderClass = 'border-slate-100';
                        
                        if (t.last_status === 'UP') {
                            statusHtml = `
                            <div class="px-3 py-1.5 rounded-2xl bg-emerald-50 text-emerald-600 border border-emerald-100 flex items-center gap-1.5 shadow-sm">
                                <span class="relative flex h-2 w-2">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                </span>
                                <span class="text-[11px] font-black uppercase tracking-wider">Online</span>
                            </div>`;
                        } else if (t.last_status === 'DOWN') {
                            borderClass = 'border-red-100 ring-2 ring-red-500/10';
                            statusHtml = `
                            <div class="px-3 py-1.5 rounded-2xl bg-red-50 text-red-600 border border-red-100 flex items-center gap-1.5 shadow-sm animate-pulse">
                                <span class="material-symbols-outlined text-sm">report</span>
                                <span class="text-[11px] font-black uppercase tracking-wider">Offline</span>
                            </div>`;
                        } else {
                            statusHtml = `
                            <div class="px-3 py-1.5 rounded-2xl bg-slate-50 text-slate-500 border border-slate-100 flex items-center gap-1.5">
                                <span class="material-symbols-outlined text-sm">schedule</span>
                                <span class="text-[11px] font-black uppercase tracking-wider">Pending</span>
                            </div>`;
                        }

                        const detailUrl = `{% url 'web_monitor_detail' target_id=0 %}`.replace('0', t.id);
                        
                        return `
                        <div class="group bg-white rounded-3xl border ${borderClass} shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col overflow-hidden relative">
                            <div class="px-6 pt-6 pb-2 flex items-start justify-between">
                                <div class="flex flex-col gap-1 min-w-0 pr-4">
                                    <a href="${detailUrl}" class="text-lg font-bold text-slate-900 truncate group-hover:text-primary transition-colors">
                                        ${t.name}
                                    </a>
                                    <p class="text-xs text-slate-400 truncate font-medium">${t.url}</p>
                                </div>
                                ${statusHtml}
                            </div>

                            <div class="px-6 py-4 flex flex-col gap-4 flex-grow">
                                <div class="flex flex-col gap-1 px-4 py-3 bg-slate-50/50 rounded-2xl border border-slate-50">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">상태 변경 시점</p>
                                    <p class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                                        <span class="material-symbols-outlined text-xs text-slate-400">history_toggle_off</span>
                                        ${t.last_status_changed_at ? t.last_status_changed_at : '<span class="text-slate-300">-</span>'}
                                    </p>
                                </div>

                                <div class="grid grid-cols-2 gap-3">
                                    <div class="flex flex-col gap-1">
                                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">최종 점검</p>
                                        <p class="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                                            <span class="material-symbols-outlined text-[14px]">done_all</span>
                                            ${t.last_checked_at ? t.last_checked_at : '-'}
                                        </p>
                                    </div>
                                    <div class="flex flex-col gap-1 items-end">
                                        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">체크 주기</p>
                                        <p class="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                                            <span class="material-symbols-outlined text-[14px]">timer</span>
                                            ${t.check_interval}s
                                        </p>
                                    </div>
                                </div>
                            </div>
                            
                            <a href="${detailUrl}" class="mt-auto px-6 py-4 bg-slate-50/50 border-t border-slate-50 flex items-center justify-between group-hover:bg-primary transition-all duration-300">
                                <span class="text-xs font-bold text-slate-600 group-hover:text-white transition-colors">상세 정보 모니터링</span>
                                <span class="material-symbols-outlined text-slate-400 text-sm group-hover:text-white group-hover:translate-x-1 transition-all">chevron_right</span>
                            </a>
                            
                            <!-- Top Progress Bar Decoration -->
                            ${t.last_status === 'DOWN' ? '<div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-red-500 to-rose-500"></div>' : ''}
                            ${t.last_status === 'UP' ? '<div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-emerald-400 to-teal-500"></div>' : ''}
                        </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = `
                        <div class="col-span-full py-20 bg-slate-50 rounded-3xl border border-dashed border-slate-200 flex flex-col items-center justify-center gap-4">
                            <div class="size-16 rounded-full bg-white shadow-sm flex items-center justify-center text-slate-300">
                                <span class="material-symbols-outlined text-4xl">inventory_2</span>
                            </div>
                            <div class="text-center">
                                <p class="text-slate-500 font-bold">모니터링할 웹사이트가 없습니다.</p>
                                <p class="text-xs text-slate-400 mt-1">새로운 대상을 추가하여 모니터링을 시작하세요.</p>
                            </div>
                            <a href="${TARGET_BASE_URL}/add/" target="_blank" class="mt-2 px-6 py-2.5 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl hover:bg-slate-50 transition-all flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">add</span>
                                모니터웹 설정 (새창)
                            </a>
                        </div>
                    `;
                }

                spinner.classList.add('hidden');
            })
            .catch(err => {
                document.getElementById('targets-container').innerHTML = `
                    <div class="col-span-full py-12 text-center text-red-500 font-bold bg-red-50 rounded-xl border border-red-100">
                        데이터를 불러오는 데 실패했습니다.<br/><span class="text-xs text-red-400 font-normal mt-1 block">모니터웹 시스템 연결을 확인하세요 (${err.message})</span>
                    </div>
                `;
                spinner.classList.add('hidden');
            });
    }

    // Auto Refresh Logic
    (function() {
        let timeLeft = 30;
        let refreshInterval;
        const timerEl = document.getElementById('refreshTimer');
        const toggleEl = document.getElementById('autoRefreshToggle');

        const savedAutoRefresh = localStorage.getItem('autoRefreshEnabled');
        if (savedAutoRefresh !== null) {
            toggleEl.checked = savedAutoRefresh === 'true';
            if (!toggleEl.checked) timerEl.classList.add('opacity-30');
        }

        function startTimer() {
            refreshInterval = setInterval(() => {
                if (toggleEl.checked) {
                    timeLeft--;
                    timerEl.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        timeLeft = 30;
                        fetchDashboardData();
                    }
                }
            }, 1000);
        }

        toggleEl.addEventListener('change', () => {
            localStorage.setItem('autoRefreshEnabled', toggleEl.checked);
            if (!toggleEl.checked) {
                timerEl.classList.add('opacity-30');
            } else {
                timerEl.classList.remove('opacity-30');
                timeLeft = 30;
                timerEl.innerText = timeLeft;
            }
        });

        // 초기로드
        fetchDashboardData();
        startTimer();
    })();
</script>
{% endblock %}
